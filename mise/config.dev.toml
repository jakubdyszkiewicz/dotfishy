# Profile for machines (macs or linux) used for development
[tools]
go = "1.27.3"
node = "24.22.1"
java = "temurin-27.0.1.1+4"
rust = "1.100.0"
cmake = "4.5.1"
opencode = "2.3.2"
claude-code = "2.1.323"
codex = "0.171.0"

[bootstrap.packages]
"apt:build-essential" = { os = "linux" } # Macs get compilers from the Xcode tools
# Linux sandbox for the coding agents above: codex runs commands in bubblewrap. macOS has its own.
# (Claude Code's optional sandbox would also need apt:socat; it is not enabled.)
"apt:bubblewrap" = { os = "linux" }
