# Profile for machines (macs or linux) used for development
[tools]
go = "1.27.3"
node = "24.22.1"
java = "temurin-27.0.1.1+4"
rust = "1.100.0"
cmake = "4.5.1"
opencode = "2.3.2"
claude-code = "2.1.323"
codex = "0.171.0"

[bootstrap.packages]
"apt:build-essential" = { os = "linux" } # Macs get compilers from the Xcode tools
"apt:bubblewrap" = { os = "linux" } # sandbox for code. macOS has its own.
# Docker for development. Servers that run containers in production (ant-services) get Docker
# from Ansible instead: it pins Compose and controls when the daemon restarts.
"apt:docker.io" = { os = "linux" }
"apt:docker-compose-v2" = { os = "linux" }
"brew-cask:rancher" = { os = "macos" }
