# Profile for machines (macs or linux) used for development
[tools]
go = "1.27.3"
node = "24.22.1"
java = "temurin-27.0.1.1+4"
rust = "1.100.0"
cmake = "4.5.1"
opencode = "2.3.2"
claude-code = "2.1.323"
codex = "0.171.0"

[bootstrap.packages]
"apt:build-essential" = { os = "linux" } # Macs get compilers from the Xcode tools
# Linux sandbox for the coding agents above: codex and Claude Code run commands in bubblewrap;
# Claude Code also proxies the sandbox's network through socat. macOS has its own sandbox.
"apt:bubblewrap" = { os = "linux" }
"apt:socat" = { os = "linux" }
