# Linux boxes provisioned by ant-hill (ant-dev, ant-services, ant-hill itself).
# Loaded with `-E linux[,<role>]` by the ant-hill `dotfiles` role: it installs git + mise,
# runs `mise bootstrap --only packages` as root, then `--only dotfiles,tools` as the user.
# Docker, users, the login shell (chsh) etc. stay in Ansible.

[bootstrap.packages]
"apt:fish" = "latest"
"apt:htop" = "latest"   # preinstalled on cloud images, not necessarily on Ubuntu Desktop (ant-hill)
"apt:ncdu" = "latest"
"apt:tmux" = "latest"
"apt:tree" = "latest"
"apt:vim" = "latest"
"apt:unzip" = "latest"
