# Global mise config. ~/.config/mise is a symlink to this directory (see install.sh).
#
#   mise bootstrap --dry-run   # preview what would change on this machine
#   mise bootstrap             # install packages, link dotfiles, apply macOS defaults, tools
#   mise dot status            # check dotfile links
#
# Machine-specific packages live in config.work.toml / config.priv.toml.
# The active one comes from ~/.dotfishy/profile (install.sh passes it as `-E <profile> --save-env`,
# which remembers it in mise/miserc.local.toml for later `mise bootstrap` runs).

[settings]
activate_aggressive = true

[tools]
go = "1.27.3"
node = "24.22.1"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/fish" = "~/.dotfishy/fish"
"~/.hammerspoon" = "~/.dotfishy/hammerspoon"
"~/.config/karabiner" = "~/.dotfishy/karabiner"
"~/.gitconfig" = "~/.dotfishy/git/gitconfig"
"~/.vimrc" = "~/.dotfishy/vim/vimrc"
"~/.vim/colors/solarized.vim" = "~/.dotfishy/vim/solarized.vim"
"~/Library/Application Support/Code/User/settings.json" = "~/.dotfishy/vscode/settings.json"

# --- macOS defaults (was macos/macos.sh) ---
[bootstrap.settings.macos.dock]
tilesize = 42.0

[bootstrap.settings.macos.defaults.NSGlobalDomain]
CGFontRenderingFontSmoothingDisabled = false

[bootstrap.settings.macos.defaults."com.apple.finder"]
WarnOnEmptyTrash = false

[bootstrap.hooks]
post-defaults = "killall Dock || true"

# --- Packages shared by all machines (was brew/Brewfile) ---
# brew / casks / App Store can't pin versions; "latest" means "installed".
# Upgrade with `mise bootstrap packages upgrade`.
[bootstrap.packages]
"brew:bat" = "latest"
"brew:blueutil" = "latest"
"brew:btop" = "latest"
"brew:cmake" = "latest"
"brew:fish" = "latest"
